[package]
name = "project-hub"
version = "0.3.3"
description = "A native, local-first personal project workspace"
edition = "2024"
license = "MIT"
build = "build.rs"

[lib]
name = "project_hub"
path = "src/lib.rs"

[[bin]]
name = "project-hub"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
open = "5"
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.17"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
slint-build = "1.17"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
