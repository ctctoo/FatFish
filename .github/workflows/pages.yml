name: Deploy promo page to GitHub Pages

on:
  # 推送到 main 且宣传页有改动时自动部署
  push:
    branches: [main]
    paths:
      - "promo.html"
      - ".github/workflows/pages.yml"
  # 允许在 Actions 面板手动触发
  workflow_dispatch:

# 并发控制：排队而不是互相取消，避免部署到一半被覆盖
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: 组装站点产物
        run: |
          mkdir -p _site
          # promo.html 作为站点首页
          cp promo.html _site/index.html
          # 跳过 Jekyll 处理（避免下划线开头的文件/目录被吞掉）
          touch _site/.nojekyll
          # 站点为单文件，无需构建；如需额外静态资源，在此一并 cp 到 _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
